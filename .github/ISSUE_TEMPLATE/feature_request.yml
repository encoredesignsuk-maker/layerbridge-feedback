name: Feature request
description: Suggest a compatible printer, 3MF quality setting or beta workflow improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        LayerBridge is a free public beta. This issue will be visible to everyone. Please do not attach proprietary model files, customer information or personal data.
  - type: dropdown
    id: printer
    attributes:
      label: Flashforge printer model
      description: Optional. Select the model for which you would like conversion support or another feature.
      options:
        - "Flashforge Adventurer 5X (AD5X)"
        - "Flashforge Adventurer 5M (AD5M)"
        - "Flashforge Adventurer 5M Pro (AD5M Pro)"
        - "Flashforge Adventurer 4"
        - "Flashforge Adventurer 4 Pro"
        - "Flashforge Adventurer 4 Lite"
        - "Flashforge Adventurer 3"
        - "Flashforge Adventurer 3 Pro"
        - "Flashforge Adventurer 3 Pro 2"
        - "Flashforge Adventurer 3 Lite"
        - "Flashforge Creator 5 Pro"
        - "Flashforge Creator 5"
        - "Flashforge Creator 4"
        - "Flashforge Creator 3 Pro"
        - "Flashforge Creator 3"
        - "Flashforge Creator Pro 2"
        - "Flashforge Creator Pro"
        - "Flashforge Creator Max 2"
        - "Flashforge Creator Max"
        - "Flashforge Creator X"
        - "Flashforge Guider 3 Ultra"
        - "Flashforge Guider 3 Plus"
        - "Flashforge Guider 3"
        - "Flashforge Guider IIS"
        - "Flashforge Guider II"
        - "Flashforge Guider"
        - "Flashforge Finder 3"
        - "Flashforge Finder 2"
        - "Flashforge Finder Lite"
        - "Flashforge Finder"
        - "Flashforge Dreamer NX"
        - "Flashforge Dreamer"
        - "Flashforge Inventor IIS"
        - "Flashforge Inventor II"
        - "Flashforge Inventor"
        - "Flashforge Artemis"
        - "Other Flashforge FDM printer (specify in feedback)"
    validations:
      required: false
  - type: input
    id: unlisted_printer
    attributes:
      label: Model not listed? Enter exact Flashforge model here
      description: Optional. If you chose Other, type the full model name shown in your slicer.
      placeholder: e.g. the exact model and variant
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Additional printer support
        - Print quality / strength / supports
        - Conversion reporting
        - Multicolour / IFS handling
        - Workflow and user interface
        - Other
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: What would you like LayerBridge to do?
      description: Explain your real-world use case and which settings should be preserved or translated.
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: How would this improve a conversion?
      description: Optional details on why this matters in Flash Studio or Flashforge Orca.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This public issue does not include private files, licensed models or customer details.
          required: true
